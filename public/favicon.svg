<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B9B8F"/>
      <stop offset="100%" stop-color="#1F7A70"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Downward trend line representing weight tracking -->
    <polyline points="-140,-60 -70,-30 0,-50 70,10 140,40" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Dot at end -->
    <circle cx="140" cy="40" r="18" fill="white"/>
    <!-- Scale base -->
    <rect x="-100" y="80" width="200" height="12" rx="6" fill="white" opacity="0.5"/>
  </g>
</svg>
